<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academic Grade &amp; CHED Compliance Lookup</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<!-- Google Font: Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ===================== TOP NAVBAR ===================== -->
<nav class="navbar navbar-expand-lg sticky-top app-navbar">
  <div class="container-fluid px-3 px-lg-4">
    <a class="navbar-brand app-brand" href="#">
      <i class="bi bi-mortarboard-fill"></i>
      <span>Grade &amp; CHED Compliance Lookup</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navContent">

      <!-- Current role indicator -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item d-flex align-items-center">
          <span id="currentUserBadge" class="badge role-badge">No active session</span>
        </li>
      </ul>

      <!-- Quick-switch demo login bar -->
      <div class="d-flex align-items-center gap-2 flex-wrap quick-switch-bar" id="quickSwitchBar">
        <span class="small text-white-50 me-1 d-none d-md-inline">Quick switch:</span>
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="adminSwitchBtn">
            <i class="bi bi-shield-lock"></i> Admin
          </button>
          <ul class="dropdown-menu" id="adminSwitchMenu"></ul>
        </div>
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="profSwitchBtn">
            <i class="bi bi-person-workspace"></i> Professor
          </button>
          <ul class="dropdown-menu" id="profSwitchMenu"></ul>
        </div>
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="studentSwitchBtn">
            <i class="bi bi-person-badge"></i> Student
          </button>
          <ul class="dropdown-menu" id="studentSwitchMenu"></ul>
        </div>
        <button class="btn btn-sm btn-gold" id="resetDataBtn" title="Reset all data to the original seeded demo set">
          <i class="bi bi-arrow-counterclockwise"></i> Reset demo data
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- ===================== ALERT / TOAST ZONE ===================== -->
<div id="globalAlertZone" class="container-fluid px-3 px-lg-4 mt-3"></div>

<!-- ===================== MAIN VIEW CONTAINER ===================== -->
<main class="container-fluid px-3 px-lg-4 py-4" id="app-content">
  <div class="empty-state text-center py-5">
    <i class="bi bi-hourglass-split display-4 text-muted"></i>
    <p class="text-muted mt-3">Loading workspace&hellip;</p>
  </div>
</main>

<footer class="app-footer text-center py-3 small">
  Comprehensive Academic Grade &amp; CHED Compliance Lookup System &middot; local demo data only, nothing leaves this browser.
</footer>

<!-- Bootstrap Bundle (Popper included) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- App bootstrap (ES module entry point) -->
<script type="module" src="js/app.js"></script>
</body>
</html>
